---
version: v2

plugins:
  - remote: buf.build/grpc-ecosystem/gateway:v2.34.0
    out: ../../api/directory
    opt:
      - paths=source_relative
      - logtostderr=true
      - generate_unbound_methods=true

  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../../api/directory
    opt: 
      - paths=source_relative

  - remote: buf.build/grpc/go:v1.6.2
    out: ../../api/directory
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  - remote: buf.build/community/planetscale-vtprotobuf:v0.6.0
    out: ../../api/directory
    opt:
      - paths=source_relative
      - features=marshal+unmarshal+size+clone+pool+equal
      - pool=github.com/aserto-dev/topaz/api/directory/v3/common.RelationIdentifier

  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: ../../docs/directory
    opt: 
      - markdown,api.md

  - remote: buf.build/community/pseudomuto-doc:v1.5.1
    out: ../../docs/directory
    opt:
      - html,index.html

  - remote: buf.build/grpc-ecosystem/openapiv3:v2.34.0
    out: ../../.tmp/openapi/directory
    opt:

