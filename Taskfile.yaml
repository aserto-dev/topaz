version: '3'

includes:
  globs: .task/settings.yaml
  os: .task/{{OS}}/taskfile_{{OS}}.yaml

silent: true

tasks:
  default:
    desc: list available commands
    cmds:
      - task: list
        silent: true

  list:
    desc: list all commands
    cmds:
      - cmd: task --list-all --sort none
        silent: true

  ensure-pre-reqs:
    internal: false # Hides it from 'task --list'
    preconditions:
      - sh: "command -v gh"
        msg: "GitHub CLI (gh) prerequisite dependency is a missing."
      - sh: "command -v go"
        msg: "Go language toolchain (go) prerequisite dependency is a missing."
      - sh: "command -v docker"
        msg: "Docker toolchain (docker) prerequisite dependency is a missing."

  ensure-deps:
    internal: false # Hides it from 'task --list'
    preconditions:      
      - sh: "command -v {{.EXT_BIN_DIR}}/golangci-lint"
        msg: "golangci-lint is not installed, run `task deps` to install."
      - sh: "command -v {{.EXT_BIN_DIR}}/goreleaser"
        msg: "goreleaser is not installed, run `task deps` to install."
      - sh: "command -v {{.EXT_BIN_DIR}}/gotestsum"
        msg: "gotestsum is not installed, run `task deps` to install."
      - sh: "command -v {{.EXT_BIN_DIR}}/svu"
        msg: "svu is not installed, run `task deps` to install."
      - sh: "command -v {{.EXT_BIN_DIR}}/syft"
        msg: "syft is not installed, run `task deps` to install."

  deps:
    desc: Install all build/dev tool dependencies
    cmds:
      - echo -e "{{.ATTN_COLOR}}==> {{.TASK}} {{.NO_COLOR}}"
      - task: info
      - task: os:install-svu
      - task: os:install-goreleaser
      - task: os:install-golangci-lint
      - task: os:install-gotestsum
      - task: os:install-syft

  info:
    cmds:
      - echo -e "{{.ATTN_COLOR}}==> {{.TASK}} {{.NO_COLOR}}"
      - 'echo "GOOS:        {{.GOOS}}"'
      - 'echo "GOARCH:      {{.GOARCH}}"'
      - 'echo "GOARCH_EXT:  {{.GOARCH_EXT}}"'
      - 'echo "EXT_DIR:     {{.EXT_DIR}}"'
      - 'echo "EXT_BIN_DIR: {{.EXT_BIN_DIR}}"'
      - 'echo "EXT_TMP_DIR: {{.EXT_TMP_DIR}}"'
      - 'echo "TOPAZ_DIST:  {{.TOPAZ_DIST}}"'
      - 'echo "TOPAZD_DIST: {{.TOPAZD_DIST}}"'
      - 'echo "REGISTRY:    {{.REGISTRY}}"'
      - 'echo "ORG:         {{.ORG}}"'
      - 'echo "REPO:        {{.REPO}}"'

  gover:
    cmds:
      - echo -e "{{.ATTN_COLOR}}==> {{.TASK}} {{.NO_COLOR}}"
      - (go env GOVERSION | grep "go{{.GO_VER}}") || (echo "go version check failed expected go{{.GO_VER}} got $(go env GOVERSION)"; exit 1)

  build:
    deps: [ensure-pre-reqs]
    cmds:
      - task: gover
      - echo -e "{{.ATTN_COLOR}}==> {{.TASK}} {{.NO_COLOR}}"
      - '{{.EXT_BIN_DIR}}/goreleaser build --config .goreleaser.yml --clean --snapshot --single-target'

  release:
    deps: [ensure-pre-reqs]
    cmds:
      - task: gover
      - echo -e "{{.ATTN_COLOR}}==> {{.TASK}} {{.NO_COLOR}}"
      - '{{.EXT_BIN_DIR}}/goreleaser release --config .goreleaser.yml --clean'

  snapshot:
    deps: [ensure-pre-reqs]
    cmds:
      - task: gover
      - echo -e "{{.ATTN_COLOR}}==> {{.TASK}} {{.NO_COLOR}}"
      - '{{.EXT_BIN_DIR}}/goreleaser release --config .goreleaser.yml --clean --snapshot --skip archive,homebrew,sbom'

  generate:
    deps: [ensure-pre-reqs]
    cmds:
      - echo -e "{{.ATTN_COLOR}}==> {{.TASK}} {{.NO_COLOR}}"
      - GOBIN={{.EXT_BIN_DIR}} go generate ./...

  lint:
    deps: [ensure-pre-reqs]
    cmds:
      - task: gover
      - echo -e "{{.ATTN_COLOR}}==> {{.TASK}} {{.NO_COLOR}}"
      - '{{.EXT_BIN_DIR}}/golangci-lint config path'
      - '{{.EXT_BIN_DIR}}/golangci-lint config verify'
      - '{{.EXT_BIN_DIR}}/golangci-lint run --config {{.ROOT_DIR}}/.golangci.yaml'

  test:
    deps: [ensure-pre-reqs]
    env:
      TESTCONTAINERS_RYUK_DISABLED:
        sh: docker context inspect --format '{{"{{"}}.Endpoints.docker.Host{{"}}"}}' 2>/dev/null | grep -q ".colima" && echo "true" || echo "false"
    cmds:
      - task: gover
      - task: build-test-container-snapshot
      - echo -e "{{.ATTN_COLOR}}==> {{.TASK}} {{.NO_COLOR}}"
      - echo -e "{{.WARN_COLOR}}!!! TESTCONTAINERS_RYUK_DISABLED=$TESTCONTAINERS_RYUK_DISABLED !!!{{.NO_COLOR}}"
      - '{{.EXT_BIN_DIR}}/gotestsum --format short-verbose -- $(go list ./... | grep -v topazd/tests) -count=1 -timeout 120s --race -parallel=1 -v -coverprofile=cover.out -coverpkg=./...'
      - '{{.EXT_BIN_DIR}}/gotestsum --format short-verbose -- $(go list ./topazd/tests/... | grep -v tests/template) -count=1 -timeout 120s --race -parallel=1 -v -coverprofile=cover.out -coverpkg=./...'
      - '{{.EXT_BIN_DIR}}/gotestsum --format short-verbose -- github.com/{{.ORG}}/{{.REPO}}/topazd/tests/template-no-tls/... -count=1 -timeout 120s --race -parallel=1 -v -coverprofile=cover.out -coverpkg=./...'
      - '{{.EXT_BIN_DIR}}/gotestsum --format short-verbose -- github.com/{{.ORG}}/{{.REPO}}/topazd/tests/template-with-tls/... -count=1 -timeout 120s --race -parallel=1 -v -coverprofile=cover.out -coverpkg=./...'

  build-test-container-snapshot:
    cmds:
      - echo -e "{{.ATTN_COLOR}}==> {{.TASK}} {{.NO_COLOR}}"
      - 'docker image rm {{.REGISTRY}}/{{.ORG}}/{{.REPO}}:0.0.0-test-$(git rev-parse --short HEAD)-$(uname -m) || true'
      - '{{.EXT_BIN_DIR}}/goreleaser release --config .goreleaser-test.yml --clean --snapshot --skip announce,archive,aur,aur-source,before,chocolatey,homebrew,ko,makeself,mcp,nfpm,nix,notarize,publish,sbom,scoop,sign,snapcraft,validate,winget' 

  container-tag:
    cmds:
      - echo -e "{{.ATTN_COLOR}}==> {{.TASK}} {{.NO_COLOR}}"
      - scripts/container-tag.sh > .container-tag.env
